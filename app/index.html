<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>own-your-glass</title>
<link rel="stylesheet" href="fonts.css">
<style>
  /* ---------------------------------------------------------------------
     own-your-glass — 10-foot control panel.

     Design read: a living-room panel for a technical owner who wants to
     verify their TV is locked down. Instrument/cockpit language: a ruled
     status board, no cards, monospace readouts.

     Rules this follows (tvos-design-guidelines + frontend-design):
       DISTANCE-01  body >= 29px, titles >= 48px, buttons >= 29px
       DISTANCE-06  TV-safe margins >= 60px
       DISTANCE-07  no thin strokes: weights >= 500, borders >= 2px
       FOCUS-01     focus is never colour alone: 4px rule + brightness + scale
       FOCUS-05     large focus targets (rows 76px, keys >= 96px)
       FOCUS-06     a default focused element on load
       VISUAL_DENSITY 8  no card boxes; rules separate data; mono for numbers

     Deliberately avoided (AI-generated tells): rounded card kit, gradient
     washes, ALL-CAPS eyebrow labels, "a · b · c" meta strings, "WORD — text"
     labels, neon glow, pure black, centred hero, emoji.
     --------------------------------------------------------------------- */
  /* webOS 4's web engine is Chromium 53: no grid (57), no flex gap (84), no
     inset (87). Spacing in flex rows uses margins; grid has a flex fallback
     in the @supports block below. */
  :root{
    --ink:#161411;        /* warm charcoal, never pure black */
    --ink-2:#1e1b17;
    --rule:#38322a;
    --text:#f4efe6;
    --muted:#a89e8e;
    --amber:#e0a33e;      /* interaction accent, one only */
    --ok:#69bd7f;
    --warn:#e0a33e;
    --bad:#e2645a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);
    font:500 30px/1.35 "IBM Plex Sans",sans-serif;-webkit-user-select:none}
  .mono{font-family:"IBM Plex Mono",monospace}

  .shell{height:100%;display:flex;flex-direction:column;padding:0 72px}

  /* ---- header: one line, a sentence, not a badge ---- */
  header{display:flex;align-items:baseline;padding:44px 0 26px;
    border-bottom:2px solid var(--rule)}
  header .wordmark{font-size:40px;font-weight:600;letter-spacing:-.01em;margin-right:28px}
  header .verdict{margin-left:auto;font-size:32px;color:var(--muted)}
  header .verdict b{font-weight:600}
  header .verdict.ok b{color:var(--ok)}
  header .verdict.bad b{color:var(--bad)}
  header .verdict.busy b{color:var(--amber)}

  /* ---- body: two ruled columns, no cards ---- */
  .board{flex:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:0 72px;min-height:0;overflow:hidden}
  .col{display:flex;flex-direction:column;min-height:0;padding-top:22px}
  .col.right{border-left:2px solid var(--rule);padding-left:72px;overflow:auto}

  .rows{overflow:auto;min-height:0}
  .sub{display:grid;grid-template-columns:22px minmax(0,1fr) 176px;
    align-items:center;gap:22px;padding:0 20px 0 16px;height:76px;
    border-bottom:2px solid var(--rule);border-left:4px solid transparent}
  .sub .mark{width:22px;height:22px;background:var(--muted)}
  .sub.ok .mark{background:var(--ok)}
  .sub.warn .mark{background:var(--warn)}
  .sub.fail .mark{background:var(--bad)}
  .sub .label{font-size:31px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub .state{font-size:29px;color:var(--muted);text-align:right}
  .sub .tally{font-size:25px;color:var(--muted);text-align:right}
  .sub.fail .state{color:var(--bad)}
  .sub.focus{border-left-color:var(--amber);background:var(--ink-2)}
  .sub.focus .label{font-weight:600;color:#fff}

  .keys{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:2px}
  button{font:600 33px/1.1 "IBM Plex Sans",sans-serif;color:var(--text);
    background:var(--ink-2);border:3px solid var(--rule);border-radius:0;
    padding:24px 20px;min-height:96px;cursor:pointer;text-align:left;
    transition:transform .09s ease-out, background .09s}
  button .hint{display:block;font:500 23px/1.3 "IBM Plex Sans",sans-serif;
    color:var(--muted);margin-top:8px}
  button.wide{grid-column:1/-1}
  button.primary{border-color:var(--amber);color:var(--amber);background:var(--ink-2)}
  button.primary .hint{color:var(--muted)}
  button.primary.focus{background:var(--amber);border-color:var(--amber);
    color:#1d1608;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
  button.primary.focus .hint{color:#4a3a17}
  /* Focus must not resize the box: a scale() grows the element past its
     column and overflow:auto clips it on the right. Use border + brightness
     + an INSET ring, none of which change layout or can be clipped. */
  button.focus{border-color:var(--amber);background:#33291a;
    box-shadow:inset 0 0 0 4px rgba(224,163,62,.4)}
  button.focus .hint{color:var(--text)}
  button.primary.focus .hint{color:#4a3a17}
  button.warnkey.focus{border-color:var(--bad);background:#2f1a18;
    box-shadow:inset 0 0 0 4px rgba(226,100,90,.35)}
  button.focus .hint{color:var(--text)}
  button.warnkey.focus .hint{color:var(--text)}
  .groupname{font-size:26px;color:var(--muted);margin:20px 0 12px}
  /* on/off pairs: the name sits on the row and the console explains the
     focused key, so the column fits without scrolling Restore network away */
  .pair{display:grid;grid-template-columns:minmax(0,1fr) 1fr 1fr;gap:18px;
    align-items:center;margin-top:14px}
  .pair .pairname{font-size:26px;color:var(--muted)}

  /* Chromium 53 (webOS 4) has no grid: the same boxes in flex. Percentages
     and margins stand in for the fr tracks and the gaps. */
  @supports not (display:grid){
    .board{display:flex}
    .col{flex:none;width:calc((100% - 72px) * 1.35 / 2.35)}
    .col.right{width:calc((100% - 72px) / 2.35);margin-left:72px}
    .sub{display:flex}
    .sub .mark{flex:none;margin-right:22px}
    .sub .label{flex:1;min-width:0;margin-right:22px}
    .sub .state{flex:none;width:176px}
    /* each key carries 18px above and to its left; the box pulls it back out */
    .keys{display:flex;flex-wrap:wrap;margin:-18px 0 0 -18px}
    .keys button{flex:0 1 calc((100% - 36px) / 2);min-width:0;margin:18px 0 0 18px}
    .keys button.wide{flex-basis:calc(100% - 18px)}
    .pair{display:flex}
    .pair > *{flex:0 1 calc((100% - 36px) / 3);min-width:0}
    .pair button{margin-left:18px}
  }

  /* ---- console ---- */
  .console{border-top:2px solid var(--rule);padding:18px 0 24px;height:236px;
    transition:height .28s ease-out;
    display:flex;flex-direction:column;min-height:0}
  .chead{display:flex;align-items:center;margin-bottom:12px}
  .chead h2{font-size:27px;font-weight:500;color:var(--muted);margin:0 26px 0 0}
  .prog{margin-left:auto;display:flex;align-items:center;font-size:25px;
    color:var(--muted)}
  .prog .bar{width:300px;margin-left:20px;height:10px;background:#2b261e;border:2px solid var(--rule);
    position:relative;overflow:hidden}
  .prog .bar i{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--amber);
    transition:width .35s ease-out}
  .prog.indet .bar i{width:40%;animation:sweep 1.15s ease-in-out infinite}
  .prog .done{color:var(--ok)} .prog .failed{color:var(--bad)}
  @keyframes sweep{0%{left:-40%}100%{left:100%}}
  @media (prefers-reduced-motion: reduce){
    .prog.indet .bar i{animation:none;left:0;width:100%;opacity:.5}
  }
  #log{font:400 25px/1.5 "IBM Plex Mono",monospace;color:#ddd5c7;overflow:auto;
    min-height:0}
  /* while a job runs, the log gets the space: the board shrinks and the
     rows scroll, so the streaming output is the thing you can read. */
  .shell.running .console{height:460px}
  @media (prefers-reduced-motion: reduce){.console{transition:none}}
  #log .line{white-space:pre-wrap;opacity:1}
  #log .line.new{animation:lineIn .18s ease-out both}
  /* console colours are brighter than the panel palette: 25px mono at 10 feet
     needs more luminance than body text. */
  #log .ok{color:#7fe0a0} #log .fail{color:#ff8074} #log .warn{color:#ffc061}
  #log .na{color:var(--muted)}
  #log .head{color:#fff;font-weight:600;margin-top:8px}
  #log .cmd{color:var(--muted)}
  #log .strong{font-weight:600}
  @keyframes lineIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){#log .line.new{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <span class="wordmark">own-your-glass</span>
    <span class="verdict" id="verdict">checking&hellip;</span>
  </header>

  <div class="board">
    <div class="col">
      <div class="rows" id="rows"></div>
    </div>

    <div class="col right">
      <div class="keys">
        <button class="primary wide" data-act="apply">Apply hardening
          <span class="hint">installs the toolkit and locks the TV down</span></button>
        <button data-act="check">Check again<span class="hint">re-read the status</span></button>
        <button data-act="revert-all">Undo hardening<span class="hint">revert every change</span></button>
      </div>
      <div class="pair">
        <span class="pairname">DNS blocking</span>
        <button data-act="dns-on">Turn on</button>
        <button data-act="dns-off">Turn off</button>
      </div>
      <div class="pair">
        <span class="pairname">Home screen</span>
        <button data-act="home-clean">Clean</button>
        <button data-act="home-stock">Stock</button>
      </div>
      <div class="groupname">If the network breaks</div>
      <div class="keys">
        <button class="wide warnkey" data-act="restore-net">Restore network
          <span class="hint">works with no connection</span></button>
      </div>
    </div>
  </div>

  <div class="console">
    <div class="chead">
      <h2 id="logtitle">Last run</h2>
      <div class="prog" id="prog" style="display:none">
        <span id="progtext"></span>
        <span class="bar"><i id="barfill"></i></span>
      </div>
    </div>
    <div id="log"></div>
  </div>
</div>

<script>
var SVC   = "luna://org.webosbrew.hbchannel.service";
var APPID = "org.ownyourglass.control";
var ROOT  = "/var/lib/own-your-glass";
var ALOG  = "/tmp/oyg-app.log";
var DEMO  = /[?&]demo=1/.test(location.search);

/* ---------- luna: hold bridge refs, serialise ---------- */
var live = [];
function ls2(uri, method, params, cb) {
  if (DEMO) { cb(null, { stdoutString: "" }); return; }
  if (window.webOS && webOS.service && webOS.service.request) {
    webOS.service.request(uri, { method: method, parameters: params || {},
      onSuccess: function (r) { cb(null, r || {}); },
      onFailure: function (e) { cb((e && e.errorText) || "luna failure", null); } });
    return;
  }
  if (!window.PalmServiceBridge) { cb("no luna bridge", null); return; }
  var b = new PalmServiceBridge(); live.push(b);
  b.onservicecallback = function (msg) {
    var i = live.indexOf(b); if (i >= 0) live.splice(i, 1);
    var o; try { o = JSON.parse(msg); } catch (e) { o = { errorText: String(msg) }; }
    if (o && o.returnValue === false && o.errorText) cb(o.errorText, null); else cb(null, o || {});
  };
  try { b.call(uri + "/" + method, JSON.stringify(params || {})); } catch (e) { cb(String(e), null); }
}
function exec(cmd, cb) { ls2(SVC, "exec", { command: cmd }, cb); }
function out(r) { return (r && r.stdoutString) || ""; }
var chain = Promise.resolve();
function sh(cmd, cb) {
  chain = chain.then(function () {
    return new Promise(function (res) { exec(cmd, function (e, r) { cb(e, r); res(); }); });
  });
  return chain;
}

/* ---------- plain-language naming ---------- */
var PLAIN = {
  NETWORK: "Network blocking", DNS: "DNS sinkhole", MICS: "Microphones",
  VOICE: "Voice and transcription", DEBLOAT: "Debloat", APPS: "Hidden apps",
  LAUNCHER: "Home screen", POLICY: "Consents and policy", SYSTEM: "System"
};

var subs = [];
function parseFast(t) {
  subs = [];
  t.split("\n").forEach(function (l) {
    var p = l.split("|"); if (p.length < 3) return;
    var id = p[0], lvl = p[1], txt = p.slice(2).join("|");
    if (lvl === "HEADER") { subs.push({ id: id, name: PLAIN[id] || txt, lines: [] }); return; }
    var s = subs.filter(function (x) { return x.id === id; })[0];
    if (!s) { s = { id: id, name: PLAIN[id] || id, lines: [] }; subs.push(s); }
    s.lines.push({ level: lvl, text: txt });
  });
}
function stateOf(s) {
  if (s.lines.some(function (x) { return x.level === "FAIL"; })) return "fail";
  if (s.lines.some(function (x) { return x.level === "WARN"; })) return "warn";
  return "ok";
}
function esc(x) { return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ---------- focus: one cursor, spatial, never colour alone ---------- */
var nav = [], idx = 0, navStarted = false;

function render() {
  var ok = 0, bad = 0;
  subs.forEach(function (s) { stateOf(s) === "fail" ? bad++ : ok++; });

  var v = document.getElementById("verdict");
  if (bad) { v.className = "verdict bad";
    v.innerHTML = "<b>" + bad + "</b> " + (bad === 1 ? "subsystem needs" : "subsystems need") + " attention";
  } else { v.className = "verdict ok";
    v.innerHTML = "<b>" + subs.length + "</b> subsystems locked down"; }

  document.getElementById("rows").innerHTML = subs.map(function (s, i) {
    var st = stateOf(s);
    return '<div class="sub ' + st + '" data-kind="sub" data-i="' + i + '">' +
             '<span class="mark"></span>' +
             '<span class="label">' + esc(s.name) + "</span>" +
             '<span class="state">' + (st === "ok" ? "ok" : st === "warn" ? "note" : "problem") + "</span>" +
             "</div>";
  }).join("");

  buildNav();
  showFocused();
}

/* The app opens on Apply hardening. Later rebuilds (the status rows arrive
   after the buttons, and are redrawn every 20 s) keep whatever has focus,
   found by element, since the rows come first and shift every index. */
function buildNav() {
  var was = nav[idx];
  nav = [].slice.call(document.querySelectorAll('[data-kind="sub"]'))
    .concat([].slice.call(document.querySelectorAll("button[data-act]")));
  var i = was ? nav.indexOf(was) : -1;
  if (!navStarted) i = nav.indexOf(document.querySelector('button[data-act="apply"]'));
  navStarted = true;
  if (i >= 0) idx = i;
  if (idx >= nav.length) idx = 0;
  paint();
}
function paint() {
  nav.forEach(function (el, i) { el.classList.toggle("focus", i === idx); });
  /* scrollIntoView(options) arrives in Chrome 61; older engines read the
     object as `true` and snap the element to the top. */
  var el = nav[idx];
  if (el) { if (el.scrollIntoViewIfNeeded) el.scrollIntoViewIfNeeded(false); else el.scrollIntoView({ block: "nearest" }); }
}
function move(dir) {
  if (!nav.length) return;
  var cur = nav[idx].getBoundingClientRect();
  var best = -1, bestPrimary = Infinity, bestPerp = Infinity, bestAligned = false;

  nav.forEach(function (el, i) {
    if (i === idx) return;
    var r = el.getBoundingClientRect();
    var primary, perp, overlap;

    if (dir === "up" || dir === "down") {
      primary = dir === "up" ? cur.top - r.bottom : r.top - cur.bottom;
      if (primary < -4) return;
      overlap = Math.min(cur.right, r.right) - Math.max(cur.left, r.left);
      perp = Math.abs((r.left + r.width / 2) - (cur.left + cur.width / 2));
    } else {
      primary = dir === "left" ? cur.left - r.right : r.left - cur.right;
      if (primary < -4) return;
      overlap = Math.min(cur.bottom, r.bottom) - Math.max(cur.top, r.top);
      perp = Math.abs((r.top + r.height / 2) - (cur.top + cur.height / 2));
    }

    // Rank by: lines up with us > nearest in that direction > best centred.
    // Alignment must OUTRANK distance, otherwise a distant element that
    // happens to be centred wins over the one directly next to us.
    var aligned = overlap > 0;
    var better =
      (aligned && !bestAligned) ||
      (aligned === bestAligned && primary < bestPrimary - 8) ||
      (aligned === bestAligned && Math.abs(primary - bestPrimary) <= 8 && perp < bestPerp - 4);

    if (better) { best = i; bestPrimary = primary; bestPerp = perp; bestAligned = aligned; }
  });

  if (best >= 0) { idx = best; paint(); showFocused(); }
}

var pinned = null;

/* Real `oyg` output prefixes every line with a [timestamp], so matching only
   at the start of the line coloured nothing at all on a real run. Strip the
   prefix first, then look at the level token. */
function lineClass(l) {
  if (l.indexOf("@@EXIT:") === 0) return l === "@@EXIT:0" ? "ok strong" : "fail strong";
  if (/^==.*==$/.test(l)) return "head";
  if (l.indexOf("$ ") === 0) return "cmd";
  var t = l.replace(/^\[[^\]]*\]\s*/, "").replace(/^\s+/, "");
  if (/^(FAIL|ERR|ERROR)\b/.test(t)) return "fail";
  if (/^(WARN|PARTIAL)\b/.test(t)) return "warn";
  if (/^(N\/A|NA)\b/.test(t)) return "na";
  if (/^OK\b/.test(t)) return "ok";
  if (/\b(failed|not running|denied)\b/i.test(l)) return "fail";
  if (/\bwarning\b/i.test(l)) return "warn";
  return "";
}

/* Append lines one <div> at a time so the console never re-renders and never
   jumps; new lines fade in so it reads as a stream rather than a flicker. */
function appendLines(text, animate) {
  var box = document.getElementById("log");
  var frag = document.createDocumentFragment();
  text.split("\n").forEach(function (l) {
    if (l === "") return;
    var d = document.createElement("div");
    d.className = "line " + lineClass(l) + (animate ? " new" : "");
    d.textContent = l;
    frag.appendChild(d);
  });
  box.appendChild(frag);
  while (box.childElementCount > 500) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function clearLog(title) {
  if (!job || job.finished) job = null;
  paintProgress();
  document.getElementById("logtitle").textContent = title;
  document.getElementById("log").innerHTML = "";
  logText = "";
}

function showFocused() {
  var el = nav[idx]; if (!el) return;
  if (el.getAttribute("data-kind") === "sub") {
    pinned = parseInt(el.getAttribute("data-i"), 10);
    showSub(pinned);
  } else {
    pinned = null;
    var a = el.getAttribute("data-act");
    clearLog(labelOf(a));
    appendLines(hintFor(a), false);
  }
}
function showSub(i) {
  var s = subs[i]; if (!s) return;
  clearLog(s.name + "  (" + (s.lines.length === 1 ? "1 check" : s.lines.length + " checks") + ")");
  appendLines(s.lines.map(function (x) { return x.level + "  " + x.text; }).join("\n"), false);
}
function hintFor(a) {
  return {
    "apply": "Installs the toolkit into /var/lib/own-your-glass, drops the boot hook, then applies every hardening module. That includes LG's ad and promo settings, the apps LG pushes onto the app bar, HbbTV red-button apps and the phone remote-control API. It also sets the Clean home layout and turns Variant C on (ConnMan's own DNS proxy off, so LG's services go through the blocklist too): Wi-Fi drops for 7-30 s, and the console says when the internet is back.",
    "check": "Re-reads the status of all subsystems.",
    "revert-all": "Runs oyg restore: every change this toolkit made is undone.",
    "dns-on": "Starts the DNS sinkhole and points the TV's lookups at it.",
    "dns-off": "Stops the DNS sinkhole and restores normal DNS.",
    "restore-net": "Puts networking back to stock. Works with no connection.",
    "home-clean": "Turns the home into a wallpaper with your apps docked underneath: the quick cards and recommendation shelves go, the banner area shows the own-your-glass wallpaper. The Recent inputs row goes too: use the Live TV tile or the input button. Kept at every boot.",
    "home-stock": "Puts LG's own home screen layout back. Ad settings and hidden apps stay as they are."
  }[a] || "Press OK to run this.";
}

/* ---------- data ---------- */
var logText = "";
var MODULES = ["capture","mic","voice","logs","remoteone","apps","policy",
               "services","debloat","network","perms","launcher"];
var job = null;   /* {act, startedAt, seen, total, lastLineAt, phase, finished, ok} */

function fmtDur(ms) {
  var s = Math.round(ms / 1000);
  return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60 < 10 ? "0" : "") + s % 60 + "s";
}
function paintProgress() {
  var shell = document.querySelector('.shell');
  if (shell) shell.classList.toggle('running', !!(job && !job.finished));
  var box = document.getElementById("prog");
  if (!job) { box.style.display = "none"; return; }
  box.style.display = "flex";
  var txt = document.getElementById("progtext");
  var fill = document.getElementById("barfill");
  var now = Date.now();

  if (job.finished) {
    box.classList.remove("indet");
    fill.style.width = "100%";
    txt.className = job.ok ? "done" : "failed";
    txt.textContent = (job.ok ? "Finished in " : "Finished with errors after ") + fmtDur(now - job.startedAt);
    return;
  }
  var idle = Math.round((now - job.lastLineAt) / 1000);
  var tail = idle >= 5 ? " · no output for " + idle + "s" : "";
  var elapsed = " · " + fmtDur(now - job.startedAt);

  if (job.total) {
    box.classList.remove("indet");
    fill.style.width = Math.round((job.seen / job.total) * 100) + "%";
    txt.className = "";
    txt.textContent = job.phase + " " + job.seen + " of " + job.total + elapsed + tail;
  } else {
    box.classList.add("indet");
    txt.className = "";
    txt.textContent = job.phase + elapsed + tail;
  }
}

/* Before Apply hardening has installed the toolkit, /var/lib/own-your-glass
   does not exist yet: read the status with the copy bundled in the app. */
function statusCmd() {
  var f = "/scripts/status-fast.sh", a = "/applications/" + APPID + "/toolkit";
  return "for f in " + ROOT + f + " /media/developer/apps/usr/palm" + a + f +
         " /usr/palm" + a + f + "; do [ -r \"$f\" ] && exec sh \"$f\" 2>&1; done; " +
         "echo 'SYSTEM|FAIL|status script not found (reinstall the app)'";
}
/* A failed call's text can be pages long (the shell's stderr inside the
   service's error): the status line gets the line that names the problem,
   the console gets all of it. */
function shortErr(e) {
  var t = String(e), lines = t.split(/\\n|\n/), i;
  for (i = 0; i < lines.length; i++)
    if (/can't open|not found|No such|denied|refus|older than/i.test(lines[i])) return lines[i].slice(0, 160);
  return t.slice(0, 160);
}
function loadStatus() {
  sh(statusCmd(), function (e, r) {
    if (e) {
      document.getElementById("verdict").textContent = shortErr(e);
      appendLines("status check failed: " + String(e), false);
      return;
    }
    parseFast(out(r)); render();
  });
}

var LABEL = { apply: "Apply hardening", check: "Check again", "revert-all": "Undo hardening",
  "dns-on": "DNS blocking: turn on", "dns-off": "DNS blocking: turn off",
  "home-clean": "Home screen: clean", "home-stock": "Home screen: stock",
  "restore-net": "Restore network" };
function labelOf(a) { return LABEL[a] || a; }

var APP = null;
function appDir() {
  return new Promise(function (res) {
    if (APP) { res(APP); return; }
    if (DEMO) { APP = "/tmp/demo"; res(APP); return; }
    sh("for d in /media/developer/apps/usr/palm/applications/" + APPID +
       " /usr/palm/applications/" + APPID + "; do [ -d \"$d/toolkit\" ] && { echo $d; break; }; done 2>/dev/null",
      function (e, r) { APP = (out(r) || "").trim().split("\n")[0] || ROOT; res(APP); });
  });
}
function cmdFor(act, dir) {
  var T = dir + "/toolkit";
  return {
    "apply":       "OYG_NETWORK_BLOCK=1 OYG_NETWORK_STRICT=1 OYG_NETWORK_IPBLOCK=1 OYG_DNS_OVERRIDE=1 OYG_DNS_RESOLVER=1 sh " + T + "/install.sh && OYG_NETWORK_BLOCK=1 OYG_NETWORK_STRICT=1 OYG_NETWORK_IPBLOCK=1 OYG_DNS_OVERRIDE=1 OYG_DNS_RESOLVER=1 OYG_DNS_VARIANT_C=1 OYG_LAUNCHER=1 OYG_LAUNCHER_TRIM=1 sh " + ROOT + "/oyg harden",
    "check":       statusCmd(),
    "revert-all":  "OYG_NETWORK_BLOCK=1 OYG_NETWORK_STRICT=1 OYG_NETWORK_IPBLOCK=1 OYG_DNS_OVERRIDE=1 OYG_DNS_RESOLVER=1 sh " + ROOT + "/oyg restore",
    "dns-on":      "sh " + T + "/scripts/dns.sh start && if grep -q '^network.variant_c=1' " + ROOT + "/state; then sh " + T + "/scripts/go-c.sh </dev/null; fi",
    "dns-off":     "sh " + T + "/scripts/dns.sh stop",
    "home-clean":  "OYG_LAUNCHER=1 OYG_LAUNCHER_TRIM=1 sh " + T + "/oyg harden --only launcher",
    "home-stock":  "OYG_LAUNCHER=1 OYG_LAUNCHER_TRIM=0 sh " + T + "/oyg harden --only launcher",
    "restore-net": "sh " + T + "/scripts/recover-network.sh"
  }[act];
}
function sq(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

var busy = false, poller = null, ticker = null, busyUntil = 0, queued = null;
function paintQueued() {
  var v = document.getElementById("verdict");
  if (!busy || !queued) return;
  v.innerHTML = "<b>queued</b> " + labelOf(queued) + " — starts when this finishes";
}
setInterval(function () {
  if (busy && busyUntil && Date.now() > busyUntil) finishJob(false);
}, 2000);
function run(act) {
  /* Buttons never go fully dead: while a job runs the other actions are
     deferred rather than dropped, and everything unlocks as soon as the
     job's exit marker appears — not on a fixed timer. */
  if (busy) { queued = act; paintQueued(); return; }
  busy = true;
  var v = document.getElementById("verdict");
  v.className = "verdict busy";
  v.innerHTML = "<b>running</b> " + labelOf(act) + "&hellip;";
  appDir().then(function (dir) {
    var cmd = cmdFor(act, dir);
    clearLog(labelOf(act));
    appendLines("$ " + cmd + "\n", false);
    job = { act: act, startedAt: Date.now(), lastLineAt: Date.now(), seen: 0, total: 0,
            phase: (act === "apply" ? "Installing and hardening" : labelOf(act)),
            finished: false, ok: false };
    paintProgress();
    /* The & must background the nohup itself. Writing
       ": > LOG; nohup sh -c '...' >> LOG 2>&1; echo @@EXIT:$? >> LOG &"
       backgrounds only the echo, so the shell WAITS for the job and
       child_process.exec does not call back until it finishes — which
       left the console frozen on the command line and the timer at 0s. */
    if (poller) clearInterval(poller);
    if (ticker) clearInterval(ticker);
    poller = setInterval(function () { follow(); paintProgress(); }, 900);
    ticker = setInterval(paintProgress, 1000);
    /* The previous job's log stays as .prev, so Apply right after Undo
       does not wipe what Undo printed. */
    exec("mv -f " + ALOG + " " + ALOG + ".prev 2>/dev/null; : > " + ALOG + "; nohup sh -c " + sq(cmd + " >> " + ALOG + " 2>&1; echo @@EXIT:$? >> " + ALOG) +
         " >/dev/null 2>&1 </dev/null &", function () {
      follow();
      /* Watch the log for @@EXIT so the UI unlocks the moment the job is
         done; the timer is only a backstop in case the marker never comes. */
      busyUntil = Date.now() + ((act === "apply" || act === "revert-all") ? 600000 :
                                /^home-/.test(act) ? 120000 : 60000);
    });
  });
}
function finishJob(ok) {
  if (!busy) return;
  busy = false;
  if (poller) { clearInterval(poller); poller = null; }
  if (ticker) { clearInterval(ticker); ticker = null; }
  loadStatus();
  if (queued) { var q = queued; queued = null; paintQueued(); run(q); }
  else if (document.hidden) window.close();   /* left while it ran */
}
function follow() {
  exec("tail -c 40000 " + ALOG + " 2>/dev/null", function (e, r) {
    if (e) return;
    var text = out(r);
    if (text === logText) return;                 /* nothing new */
    var delta = "";
    if (logText && text.lastIndexOf(logText, 0) === 0) {
      delta = text.slice(logText.length);
      appendLines(delta.replace(/^\n/, ""), true);          /* stream only what is new */
    } else {
      document.getElementById("log").innerHTML = "";         /* truncated: full refresh */
      delta = text;
      appendLines(text, false);
    }
    logText = text;
    if (/@@EXIT:(\d+)/.test(text)) {
      job && (job.finished = true, job.ok = RegExp.$1 === "0");
      paintProgress();
      finishJob(RegExp.$1 === "0");
      return;
    }
    if (job && delta) {
      job.lastLineAt = Date.now();
      /* "N of total" only means something for a full run: the home-screen
         keys run one module and keep the indeterminate bar. */
      var heads = text.match(/^==\s*([a-z]+):\s*harden\s*==$/gm);
      if (heads && job.act === "apply") {
        var total = MODULES.length;
        var seen = heads.length;
        if (!job.total && /install\.sh/.test(text) && !heads.length) job.phase = "Installing toolkit";
        job.total = total;
        job.seen = Math.min(seen, total);
        var last = heads[heads.length - 1].replace(/^==\s*/, "").replace(/:.*$/, "");
        job.phase = "Hardening " + last;
      }
      var m = text.match(/@@EXIT:(\d+)/);
      if (m) {
        job.finished = true;
        job.ok = (m[1] === "0");
        if (poller) { clearInterval(poller); poller = null; }
        paintProgress();
        setTimeout(function () { loadStatus(); }, 400);
      }
    }
  });
}

/* ---------- input ---------- */
document.addEventListener("keydown", function (ev) {
  var k = ev.keyCode, h = true;
  if (k === 38) move("up");
  else if (k === 40) move("down");
  else if (k === 37) move("left");
  else if (k === 39) move("right");
  else if (k === 13) {
    var el = nav[idx];
    if (el && el.getAttribute("data-act")) run(el.getAttribute("data-act"));
  }
  else if (k === 403) run("restore-net");
  else if (k === 404) run("apply");
  else if (k === 405) run("revert-all");
  else if (k === 406) run("check");
  else h = false;
  if (h) ev.preventDefault();
});
document.addEventListener("click", function (ev) {
  var el = ev.target.closest && ev.target.closest('[data-kind="sub"],button[data-act]');
  if (!el) return;
  var i = nav.indexOf(el);
  if (i >= 0) { idx = i; paint(); showFocused(); }
  if (el.getAttribute("data-act")) run(el.getAttribute("data-act"));
});

    "SYSTEM|OK|uptime 3h10m"
  ].join("\n"));
  render();
} else {
  loadStatus();
  setInterval(function () { if (!busy && !document.hidden) loadStatus(); }, 20000);
  /* Leaving the app closes it. webOS otherwise keeps it loaded (~37 MB) with
     the status poll running behind other apps for hours. A job still
     running finishes first (finishJob closes then); it runs under nohup, so
     closing never stops it. */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && !busy) window.close();
  });
}
